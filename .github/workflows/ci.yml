name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux first and deliberately: four of the guard tests need to create
    # symlinks, which Windows refuses without developer mode. Those tests skip
    # locally and run here, including the one covering the swap between scan
    # and delete. Windows is kept in the matrix because junction handling and
    # path resolution differ there and the guard has to hold on both.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=sweep_mcp --cov-report=term-missing

      - name: Fail if the symlink tests were skipped on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pytest -q -rs 2>&1 | tee out.txt
          if grep -q "cannot create symlinks" out.txt; then
            echo "Symlink tests skipped on Linux - they must run here."
            exit 1
          fi
